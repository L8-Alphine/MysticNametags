plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.mystichorizons.mysticnametags'
version = '1.2.8'

repositories {
    mavenCentral()
    // Official Hytale Maven repository
    maven {
        name = 'hytale-release'
        url = 'https://maven.hytale.com/release'
    }
    maven {
        name = 'hytale-pre-release'
        url = 'https://maven.hytale.com/pre-release'
    }
    maven {
        url = uri("https://repo.codemc.io/repository/creatorfromhell/")
    }
}

dependencies {
    // Hytale Server API from official Maven repository
    compileOnly 'com.hypixel.hytale:Server:0.6.0'

    // JSR305 annotations (@Nonnull, @Nullable)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:9.3.0'

    // SQLite JDBC Driver
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // Redis client (network-wide tag storage + cross-server sync)
    implementation 'redis.clients:jedis:5.2.0'

    // PlaceholderAPI
    compileOnly files('libs/WiFlowPlaceholderAPI-1.0.0.jar')
    compileOnly files('libs/PlaceholderAPI-1.0.3-CurseForge.jar')

    // VaultUnlocked Support
    compileOnly('net.cfh.vault:VaultUnlocked:2.20.0') {
        transitive = false
    }

    // EliteEssentials Support
    compileOnly files('libs/EliteEssentials-1.1.6.jar')

    // TheEconomy Support
    compileOnly files('libs/EconomySystem-1.0.8.1-beta.jar')

    // HyEssentialsX Support
    compileOnly files('libs/hyessentialsx-1.2.9.jar')

    // EcoTale Support
    compileOnly files('libs/Ecotale-1.0.7.jar')

    // CoinsAndMarkets Support
    compileOnly files('libs/CoinsAndMarkets-0.2.6.jar')

    // LuckPerms Support
    compileOnly 'net.luckperms:api:5.5'

    // HyperPerms Support
    compileOnly files('libs/HyperPerms-2.9.0.jar')

    // PermissionsPlus
    compileOnly files('libs/PermissionsPlus-1.1.0.jar')

    // PrefixesPlus
    compileOnly files('libs/PrefixesPlus-3.2.6.jar')

    //RPGLeveling Support
    compileOnly files('libs/RPGLeveling-0.3.6.jar')

    // Endless Leveling
    compileOnly files('libs/EndlessLeveling.jar')

    // MMOSkills
    compileOnly files('libs/MMOSkillTree-1.4.1.jar')

    // EcoQuest Support - Adds support for adventurer ranks like E -> SS rank
    compileOnly files('libs/EcoTaleQuests-1.5.2.jar')

    // Playtime Plugins
    compileOnly files('libs/Playtime-1.3.0.jar')

    // New Tag?
    compileOnly files('libs/PerfectHolograms-1.0.jar')

//    // TEMP
//    compileOnly files('libs/EcoTaleQuests-1.3.3.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def generatedHStatsIdentityDir = layout.buildDirectory.dir('generated/hstats-identity-src')

sourceSets {
    main {
        java {
            srcDir generatedHStatsIdentityDir
        }
    }
}

tasks.register('generateHStatsIdentity') {
    def hstatsUuidProvider = providers.gradleProperty('mysticnametags.hstats.uuid')
        .orElse(providers.environmentVariable('MYSTICNAMETAGS_HSTATS_UUID'))
        .orElse('')

    inputs.property('hstatsUuid', hstatsUuidProvider)
    outputs.dir(generatedHStatsIdentityDir)

    doLast {
        def outDir = generatedHStatsIdentityDir.get()
            .file('com/mystichorizons/mysticnametags/generated')
            .asFile
        delete outDir
        outDir.mkdirs()

        def uuid = hstatsUuidProvider.get().trim()
        def file = new File(outDir, 'HStatsIdentity.java')

        if (uuid.isEmpty()) {
            file.text = '''package com.mystichorizons.mysticnametags.generated;

public final class HStatsIdentity {
    private HStatsIdentity() {
    }

    public static String getModUuid() {
        return null;
    }
}
'''
            return
        }

        uuid = UUID.fromString(uuid).toString()

        byte[] key = [0x5d, 0x23, 0x6f, 0x19, 0x44, 0x71, 0x08, 0x32, 0x6a, 0x15, 0x53, 0x2c] as byte[]
        byte[] raw = uuid.getBytes('UTF-8')
        def encoded = (0..<raw.length).collect { int index ->
            (raw[index] ^ key[index % key.length]) & 0xff
        }
        def keyValues = key.collect { int value -> "(byte) 0x${String.format('%02x', value & 0xff)}" }.join(', ')
        def dataValues = encoded.collect { int value -> "(byte) 0x${String.format('%02x', value)}" }.join(', ')

        file.text = """package com.mystichorizons.mysticnametags.generated;

import java.nio.charset.StandardCharsets;

public final class HStatsIdentity {
    private static final byte[] DATA = new byte[] { ${dataValues} };
    private static final byte[] KEY = new byte[] { ${keyValues} };

    private HStatsIdentity() {
    }

    public static String getModUuid() {
        byte[] decoded = new byte[DATA.length];
        for (int index = 0; index < DATA.length; index++) {
            decoded[index] = (byte) (DATA[index] ^ KEY[index % KEY.length]);
        }
        return new String(decoded, StandardCharsets.UTF_8);
    }
}
"""
    }
}

shadowJar {
    archiveClassifier.set('')
    // Exclude server classes from the final JAR
    dependencies {
        exclude(dependency { it.moduleGroup == 'com.hypixel' })
    }
}

// Disable the default jar task to avoid conflicts with shadowJar
tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

def generatedGlyphSlotDir = layout.buildDirectory.dir('generated/glyph-slot-models')
// Keep in sync with GlyphAssets.MIN_SLOT_OFFSET / MAX_SLOT_OFFSET / SLOT_OFFSET_STEP.
// A line of n glyphs needs offsets up to 4*(n-1), so +/-256 covers 65 chars per line;
// the renderer clamps beyond that and the outermost glyphs would pile up.
def glyphSlotMin = -256
def glyphSlotMax = 256
def glyphSlotStep = 4

tasks.register('generateGlyphSlotModels') {
    outputs.dir(generatedGlyphSlotDir)
    outputs.upToDateWhen { false }

    doLast {
        def outDir = generatedGlyphSlotDir.get().file('Common/NPC/MysticNameTags').asFile
        delete outDir
        outDir.mkdirs()

        for (int x = glyphSlotMin; x <= glyphSlotMax; x += glyphSlotStep) {
            def sign = x < 0 ? 'm' : 'p'
            def name = String.format('GlyphSlot_%s%03d.blockymodel', sign, Math.abs(x))
            def file = new File(outDir, name)
            file.setText("""{
  "nodes": [
    {
      "id": "1",
      "name": "face",
      "position": {"x": ${x}, "y": 8, "z": 0},
      "orientation": {"x": 0, "y": 0, "z": 0, "w": 1},
      "shape": {
        "type": "quad",
        "offset": {"x": 0, "y": 0, "z": 0},
        "stretch": {"x": 1, "y": 1, "z": 1},
        "settings": {
          "isPiece": false,
          "size": {"x": 16, "y": 16},
          "normal": "+Z"
        },
        "textureLayout": {
          "front": {
            "offset": {"x": 0, "y": 0},
            "mirror": {"x": false, "y": false},
            "angle": 0
          }
        },
        "unwrapMode": "custom",
        "visible": true,
        "doubleSided": true,
        "shadingMode": "fullbright"
      }
    }
  ],
  "format": "character",
  "lod": "auto"
}
""", 'UTF-8')
        }
    }
}

tasks.register('verifyGlyphAssets') {
    def glyphRoot = file('src/main/resources/Common/NPC/MysticNameTags')
    inputs.files(fileTree(glyphRoot) {
        include '**/glyph_*.png'
        include 'Glyph*.blockymodel'
    })
    inputs.file('src/main/resources/Server/Models/MysticNameTags/GlyphLineBase.json')

    doLast {
        def families = [
                default: [dir: glyphRoot, size: 16],
                comic: [dir: file("${glyphRoot}/comic"), size: 32],
                cursive: [dir: file("${glyphRoot}/cursive"), size: 32],
                impact: [dir: file("${glyphRoot}/impact"), size: 32],
                mono: [dir: file("${glyphRoot}/mono"), size: 32],
                sans: [dir: file("${glyphRoot}/sans"), size: 32],
                serif: [dir: file("${glyphRoot}/serif"), size: 32],
                thin: [dir: file("${glyphRoot}/thin"), size: 32]
        ]

        Set<String> expectedNames = null
        families.each { String family, Map spec ->
            def pngs = spec.dir.listFiles({ File dir, String name ->
                name.startsWith('glyph_') && name.endsWith('.png')
            } as FilenameFilter)?.toList()?.sort { it.name } ?: []

            if (pngs.size() != 96) {
                throw new GradleException("Glyph family '${family}' must contain 96 PNGs; found ${pngs.size()}")
            }

            Set<String> names = pngs.collect { it.name } as Set
            if (expectedNames == null) {
                expectedNames = names
            } else if (names != expectedNames) {
                throw new GradleException("Glyph family '${family}' does not match the default glyph filename set")
            }

            pngs.each { File png ->
                def image = javax.imageio.ImageIO.read(png)
                if (image == null) {
                    throw new GradleException("Unreadable glyph PNG: ${png}")
                }
                if (image.width != spec.size || image.height != spec.size) {
                    throw new GradleException("${png} must be ${spec.size}x${spec.size}; found ${image.width}x${image.height}")
                }
                if (!image.colorModel.hasAlpha()) {
                    throw new GradleException("Glyph PNG requires transparency: ${png}")
                }

                for (int y = 0; y < image.height; y++) {
                    for (int x = 0; x < image.width; x++) {
                        int argb = image.getRGB(x, y)
                        if (((argb >>> 24) & 0xFF) != 0 && (argb & 0xFFFFFF) != 0xFFFFFF) {
                            throw new GradleException("Glyph pixels must be white for runtime tinting: ${png} at ${x},${y}")
                        }
                    }
                }
            }
        }

        def parser = new groovy.json.JsonSlurper()
        def carrier = parser.parse(file("${glyphRoot}/GlyphLineBase.blockymodel"))
        // Structure only. Node visibility is a rendering choice, not a validity property, and
        // pinning it to false here previously made the carrier-visibility question untestable.
        if (carrier.format != 'character' || carrier.nodes?.size() != 1
                || carrier.nodes[0].shape?.type != 'quad') {
            throw new GradleException('GlyphLineBase must be a single-quad Update 6 carrier model')
        }

        [[name: 'GlyphQuad.blockymodel', size: 16], [name: 'GlyphQuad32.blockymodel', size: 32]].each { spec ->
            def quad = parser.parse(file("${glyphRoot}/${spec.name}"))
            def shape = quad.nodes?.getAt(0)?.shape
            if (quad.format != 'character' || shape?.type != 'quad' || shape?.visible != true
                    || shape?.settings?.size?.x != spec.size || shape?.settings?.size?.y != spec.size) {
                throw new GradleException("Invalid Update 6 glyph quad: ${spec.name}")
            }
        }

        def carrierAsset = parser.parse(file('src/main/resources/Server/Models/MysticNameTags/GlyphLineBase.json'))
        if (carrierAsset.Model != 'NPC/MysticNameTags/GlyphLineBase.blockymodel') {
            throw new GradleException('GlyphLineBase model asset does not reference the carrier blockymodel')
        }
    }
}

tasks.named('processResources') {
    dependsOn 'generateGlyphSlotModels', 'verifyGlyphAssets'
    // Update 6 run models reference glyph textures directly. The old per-character
    // ModelAssets are intentionally omitted to avoid decoding 768 unused JSON assets.
    exclude 'Server/Models/MysticNameTags/Glyph_*.json'
    exclude 'Server/Models/MysticNameTags/GlyphBase*.json'
    from(generatedGlyphSlotDir)
}

tasks.named('compileJava') {
    dependsOn 'generateHStatsIdentity'
}

// Deploy plugin JAR to server mods folder
tasks.register('deployToServer', Copy) {
    // Using 'from shadowJar' automatically adds task dependency and proper input tracking
    from shadowJar
    into 'server/mods'
    doLast {
        println "Deployed to server/mods/"
    }
}

// Watch for changes and auto-rebuild (useful during development)
tasks.register('watch') {
    doLast {
        println "Watching for changes... Press Ctrl+C to stop."
        println "Run 'gradle build --continuous' for auto-rebuild on file changes."
    }
}
