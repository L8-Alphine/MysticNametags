plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.mystichorizons.mysticnametags'
version = '1.3.0'

repositories {
    mavenCentral()
    // Official Hytale Maven repository
    maven {
        name = 'hytale-release'
        url = 'https://maven.hytale.com/release'
    }
    maven {
        name = 'hytale-pre-release'
        url = 'https://maven.hytale.com/pre-release'
    }
    maven {
        url = uri("https://repo.codemc.io/repository/creatorfromhell/")
    }
}

dependencies {
    // Hytale Server API from official Maven repository
    compileOnly 'com.hypixel.hytale:Server:0.6.0'

    // JSR305 annotations (@Nonnull, @Nullable)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:9.3.0'

    // MariaDB Connector/J - storageBackend = MARIADB. MySQL Connector/J and a
    // MariaDB server do not always agree on the handshake, so MariaDB gets the
    // driver its own project ships. waffle-jna is Windows SSPI auth we never use.
    implementation('org.mariadb.jdbc:mariadb-java-client:3.5.3') {
        exclude group: 'com.github.waffle'
    }

    // SQLite JDBC Driver
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // Redis client (network-wide tag storage + cross-server sync)
    implementation 'redis.clients:jedis:5.2.0'

    // MysticLicenses v2 client (licensed features: tag banners). Built from sdk/mystic-license-java in the
    // MysticLicensing repo and dependency-free. Lives in vendor/ because libs/ is not committed. Shaded as is,
    // like gson and jedis: each plugin has its own class loader, and relocating would need a newer ASM than
    // Shadow 8.3.0 carries, since relocation rewrites every class and ASM 9.7 cannot read Java 25 classes.
    implementation files('vendor/mystic-licenses-sdk-2.0.0-SNAPSHOT.jar')

    // PlaceholderAPI
    compileOnly files('libs/WiFlowPlaceholderAPI-1.0.0.jar')
    compileOnly files('libs/PlaceholderAPI-1.0.3-CurseForge.jar')

    // VaultUnlocked Support
    compileOnly('net.cfh.vault:VaultUnlocked:2.20.0') {
        transitive = false
    }

    // EliteEssentials Support
    compileOnly files('libs/EliteEssentials-1.1.6.jar')

    // TheEconomy Support
    compileOnly files('libs/EconomySystem-1.0.8.1-beta.jar')

    // HyEssentialsX Support
    compileOnly files('libs/hyessentialsx-1.2.9.jar')

    // EcoTale Support
    compileOnly files('libs/Ecotale-1.0.7.jar')

    // CoinsAndMarkets Support
    compileOnly files('libs/CoinsAndMarkets-0.2.6.jar')

    // LuckPerms Support
    compileOnly 'net.luckperms:api:5.5'

    // HyperPerms Support
    compileOnly files('libs/HyperPerms-2.9.0.jar')

    // PermissionsPlus
    compileOnly files('libs/PermissionsPlus-1.1.0.jar')

    // PrefixesPlus
    compileOnly files('libs/PrefixesPlus-3.2.6.jar')

    //RPGLeveling Support
    compileOnly files('libs/RPGLeveling-0.3.6.jar')

    // Endless Leveling
    compileOnly files('libs/EndlessLeveling.jar')

    // MMOSkills
    compileOnly files('libs/MMOSkillTree-1.4.1.jar')

    // EcoQuest Support - Adds support for adventurer ranks like E -> SS rank
    compileOnly files('libs/EcoTaleQuests-1.5.2.jar')

    // Playtime Plugins
    compileOnly files('libs/Playtime-1.3.0.jar')

    // New Tag?
    compileOnly files('libs/PerfectHolograms-1.0.jar')

//    // TEMP
//    compileOnly files('libs/EcoTaleQuests-1.3.3.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def generatedHStatsIdentityDir = layout.buildDirectory.dir('generated/hstats-identity-src')
def generatedLicensingDir = layout.buildDirectory.dir('generated/licensing-src')

sourceSets {
    main {
        java {
            srcDir generatedHStatsIdentityDir
            srcDir generatedLicensingDir
        }
    }
}

tasks.register('generateHStatsIdentity') {
    def hstatsUuidProvider = providers.gradleProperty('mysticnametags.hstats.uuid')
        .orElse(providers.environmentVariable('MYSTICNAMETAGS_HSTATS_UUID'))
        .orElse('')

    inputs.property('hstatsUuid', hstatsUuidProvider)
    outputs.dir(generatedHStatsIdentityDir)

    doLast {
        def outDir = generatedHStatsIdentityDir.get()
            .file('com/mystichorizons/mysticnametags/generated')
            .asFile
        delete outDir
        outDir.mkdirs()

        def uuid = hstatsUuidProvider.get().trim()
        def file = new File(outDir, 'HStatsIdentity.java')

        if (uuid.isEmpty()) {
            file.text = '''package com.mystichorizons.mysticnametags.generated;

public final class HStatsIdentity {
    private HStatsIdentity() {
    }

    public static String getModUuid() {
        return null;
    }
}
'''
            return
        }

        uuid = UUID.fromString(uuid).toString()

        byte[] key = [0x5d, 0x23, 0x6f, 0x19, 0x44, 0x71, 0x08, 0x32, 0x6a, 0x15, 0x53, 0x2c] as byte[]
        byte[] raw = uuid.getBytes('UTF-8')
        def encoded = (0..<raw.length).collect { int index ->
            (raw[index] ^ key[index % key.length]) & 0xff
        }
        def keyValues = key.collect { int value -> "(byte) 0x${String.format('%02x', value & 0xff)}" }.join(', ')
        def dataValues = encoded.collect { int value -> "(byte) 0x${String.format('%02x', value)}" }.join(', ')

        file.text = """package com.mystichorizons.mysticnametags.generated;

import java.nio.charset.StandardCharsets;

public final class HStatsIdentity {
    private static final byte[] DATA = new byte[] { ${dataValues} };
    private static final byte[] KEY = new byte[] { ${keyValues} };

    private HStatsIdentity() {
    }

    public static String getModUuid() {
        byte[] decoded = new byte[DATA.length];
        for (int index = 0; index < DATA.length; index++) {
            decoded[index] = (byte) (DATA[index] ^ KEY[index % KEY.length]);
        }
        return new String(decoded, StandardCharsets.UTF_8);
    }
}
"""
    }
}

shadowJar {
    archiveClassifier.set('')
    // Without this the JDBC drivers' META-INF/services/java.sql.Driver files
    // overwrite each other and only the last one shaded survives.
    mergeServiceFiles()
    // Exclude server classes from the final JAR
    dependencies {
        exclude(dependency { it.moduleGroup == 'com.hypixel' })
    }
}

// Disable the default jar task to avoid conflicts with shadowJar
tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

def generatedGlyphSlotDir = layout.buildDirectory.dir('generated/glyph-slot-models')
// Keep in sync with GlyphAssets.MIN_SLOT_OFFSET / MAX_SLOT_OFFSET / SLOT_OFFSET_STEP.
// A line of n glyphs needs offsets up to 4*(n-1), so +/-256 covers 65 chars per line;
// the renderer clamps beyond that and the outermost glyphs would pile up.
def glyphSlotMin = -256
def glyphSlotMax = 256
def glyphSlotStep = 4

// Keep in sync with GlyphAssets.TEXTURE_CANVAS / TEXTURE_GUTTER / DEFAULT_CELL / FONT_CELL.
// Every glyph PNG is a 96x96 canvas with its ink cell at (32,32). The client's entity atlas
// refuses textures under 32x32 or off the 32 grid, and the quad renderer samples a little
// outside the UV box at grazing angles, so the cell needs transparent room on every side.
def glyphTextureCanvas = 96
def glyphTextureGutter = 32
// One slot set per ink cell size: GlyphSlot_* for the 16px default family, GlyphSlot32_*
// for the 32px families. The quad is the cell; the UV box sits on the cell in the texture.
def glyphSlotSets = [[prefix: 'GlyphSlot_', cell: 16], [prefix: 'GlyphSlot32_', cell: 32]]
def glyphFontRoot = file('src/main/resources/glyphfonts')
def glyphModelRoot = file('src/main/resources/Common/NPC/MysticNameTags')
def glyphFamilies = [
        default: 16,
        comic: 32,
        cursive: 32,
        impact: 32,
        mono: 32,
        sans: 32,
        serif: 32,
        thin: 32
]

tasks.register('generateGlyphSlotModels') {
    outputs.dir(generatedGlyphSlotDir)
    outputs.upToDateWhen { false }

    doLast {
        def outDir = generatedGlyphSlotDir.get().file('Common/NPC/MysticNameTags').asFile
        delete outDir
        outDir.mkdirs()

        glyphSlotSets.each { Map set ->
            int cell = set.cell as int
            int halfCell = cell.intdiv(2)
            for (int x = glyphSlotMin; x <= glyphSlotMax; x += glyphSlotStep) {
                def sign = x < 0 ? 'm' : 'p'
                def name = String.format('%s%s%03d.blockymodel', set.prefix, sign, Math.abs(x))
                def file = new File(outDir, name)
                file.setText("""{
  "nodes": [
    {
      "id": "1",
      "name": "face",
      "position": {"x": ${x}, "y": ${halfCell}, "z": 0},
      "orientation": {"x": 0, "y": 0, "z": 0, "w": 1},
      "shape": {
        "type": "quad",
        "offset": {"x": 0, "y": 0, "z": 0},
        "stretch": {"x": 1, "y": 1, "z": 1},
        "settings": {
          "isPiece": false,
          "size": {"x": ${cell}, "y": ${cell}},
          "normal": "+Z"
        },
        "textureLayout": {
          "front": {
            "offset": {"x": ${glyphTextureGutter}, "y": ${glyphTextureGutter}},
            "mirror": {"x": false, "y": false},
            "angle": 0
          }
        },
        "unwrapMode": "custom",
        "visible": true,
        "doubleSided": true,
        "shadingMode": "fullbright"
      }
    }
  ],
  "format": "character",
  "lod": "auto"
}
""", 'UTF-8')
            }
        }
    }
}

tasks.register('verifyGlyphAssets') {
    inputs.files(fileTree(glyphFontRoot) {
        include '**/glyph_*.png'
    })
    inputs.files(fileTree(glyphModelRoot) {
        include 'Glyph*.blockymodel'
    })
    inputs.file('src/main/resources/Server/Models/MysticNameTags/GlyphLineBase.json')

    doLast {
        Set<String> expectedNames = null
        glyphFamilies.each { String family, int cell ->
            def dir = new File(glyphFontRoot, family)
            def pngs = dir.listFiles({ File d, String name ->
                name.startsWith('glyph_') && name.endsWith('.png')
            } as FilenameFilter)?.toList()?.sort { it.name } ?: []

            if (pngs.size() != 96) {
                throw new GradleException("Glyph family '${family}' must contain 96 PNGs; found ${pngs.size()}")
            }

            Set<String> names = pngs.collect { it.name } as Set
            if (expectedNames == null) {
                expectedNames = names
            } else if (names != expectedNames) {
                throw new GradleException("Glyph family '${family}' does not match the default glyph filename set")
            }

            int cellMin = glyphTextureGutter
            int cellMax = glyphTextureGutter + cell
            pngs.each { File png ->
                def image = javax.imageio.ImageIO.read(png)
                if (image == null) {
                    throw new GradleException("Unreadable glyph PNG: ${png}")
                }
                if (image.width != glyphTextureCanvas || image.height != glyphTextureCanvas) {
                    throw new GradleException("${png} must be ${glyphTextureCanvas}x${glyphTextureCanvas}; found ${image.width}x${image.height}")
                }
                if (!image.colorModel.hasAlpha()) {
                    throw new GradleException("Glyph PNG requires transparency: ${png}")
                }

                for (int y = 0; y < image.height; y++) {
                    for (int x = 0; x < image.width; x++) {
                        int argb = image.getRGB(x, y)
                        if (((argb >>> 24) & 0xFF) == 0) {
                            continue
                        }
                        if (x < cellMin || x >= cellMax || y < cellMin || y >= cellMax) {
                            throw new GradleException("Glyph ink must stay inside the ${cell}x${cell} cell at (${cellMin},${cellMin}): ${png} at ${x},${y}")
                        }
                        if ((argb & 0xFFFFFF) != 0xFFFFFF) {
                            throw new GradleException("Glyph pixels must be white for runtime tinting: ${png} at ${x},${y}")
                        }
                    }
                }
            }
        }

        def parser = new groovy.json.JsonSlurper()
        def carrier = parser.parse(new File(glyphModelRoot, 'GlyphLineBase.blockymodel'))
        // Structure only. Node visibility is a rendering choice, not a validity property, and
        // pinning it to false here previously made the carrier-visibility question untestable.
        if (carrier.format != 'character' || carrier.nodes?.size() != 1
                || carrier.nodes[0].shape?.type != 'quad') {
            throw new GradleException('GlyphLineBase must be a single-quad Update 6 carrier model')
        }

        [[name: 'GlyphQuad.blockymodel', size: 16], [name: 'GlyphQuad32.blockymodel', size: 32]].each { spec ->
            def quad = parser.parse(new File(glyphModelRoot, spec.name))
            def shape = quad.nodes?.getAt(0)?.shape
            if (quad.format != 'character' || shape?.type != 'quad' || shape?.visible != true
                    || shape?.settings?.size?.x != spec.size || shape?.settings?.size?.y != spec.size) {
                throw new GradleException("Invalid Update 6 glyph quad: ${spec.name}")
            }
            def uv = shape?.textureLayout?.front?.offset
            if (uv?.x != glyphTextureGutter || uv?.y != glyphTextureGutter) {
                throw new GradleException("Glyph quad UV box must sit on the ink cell at (${glyphTextureGutter},${glyphTextureGutter}): ${spec.name}")
            }
        }

        def carrierAsset = parser.parse(file('src/main/resources/Server/Models/MysticNameTags/GlyphLineBase.json'))
        if (carrierAsset.Model != 'NPC/MysticNameTags/GlyphLineBase.blockymodel') {
            throw new GradleException('GlyphLineBase model asset does not reference the carrier blockymodel')
        }
    }
}

tasks.named('processResources') {
    dependsOn 'generateGlyphSlotModels', 'verifyGlyphAssets'
    // Update 6 run models reference glyph textures directly. The old per-character
    // ModelAssets are intentionally omitted to avoid decoding 768 unused JSON assets.
    exclude 'Server/Models/MysticNameTags/Glyph_*.json'
    exclude 'Server/Models/MysticNameTags/GlyphBase*.json'
    from(generatedGlyphSlotDir)
}

// Where this build's licensing lives: the MysticLicenses API, and the keys it signs authorizations with (raw Ed25519
// in base64url, as GET /api/v2/runtime/public-keys publishes them), as kid=key pairs separated by commas. Keep a
// retired key listed until nothing it signed can still be cached. Both are fixed at build time and never read at
// runtime, so a server operator cannot point the mod at a licensing service of their own. A build without them
// works normally with tag banners off. mystic.licensing.* is shared by every Mystic mod (put it in
// ~/.gradle/gradle.properties); mysticnametags.licensing.* overrides it here.
tasks.register('generateLicensingEndpoint') {
    def urlProvider = providers.gradleProperty('mysticnametags.licensing.url')
        .orElse(providers.gradleProperty('mystic.licensing.url'))
        .orElse(providers.environmentVariable('MYSTICNAMETAGS_LICENSING_URL'))
        .orElse(providers.environmentVariable('MYSTIC_LICENSING_URL'))
        .orElse('')
    def keysProvider = providers.gradleProperty('mysticnametags.licensing.keys')
        .orElse(providers.gradleProperty('mystic.licensing.keys'))
        .orElse(providers.environmentVariable('MYSTICNAMETAGS_LICENSING_KEYS'))
        .orElse(providers.environmentVariable('MYSTIC_LICENSING_KEYS'))
        .orElse('')

    inputs.property('licensingUrl', urlProvider)
    inputs.property('licensingKeys', keysProvider)
    outputs.dir(generatedLicensingDir)

    doLast {
        def outDir = generatedLicensingDir.get()
            .file('com/mystichorizons/mysticnametags/generated')
            .asFile
        delete outDir
        outDir.mkdirs()

        def url = urlProvider.get().trim()
        def keys = new LinkedHashMap<String, String>()
        keysProvider.get().split(',').collect { it.trim() }.findAll { !it.isEmpty() }.each { String entry ->
            def parts = entry.split('=', 2)
            def kid = parts[0].trim()
            if (parts.length != 2 || !(kid ==~ /[A-Za-z0-9._-]{1,64}/)) {
                throw new GradleException("mysticnametags.licensing.keys takes kid=publicKeyRaw pairs separated by commas")
            }
            def raw = parts[1].trim()
            byte[] decoded = null
            try {
                decoded = Base64.urlDecoder.decode(raw)
            } catch (IllegalArgumentException ignored) {
            }
            if (decoded == null || decoded.length != 32) {
                throw new GradleException("Licensing key '${kid}' is not a raw Ed25519 public key in base64url (32 bytes)")
            }
            keys[kid] = raw
        }
        if (url.isEmpty() != keys.isEmpty()) {
            throw new GradleException('Set both mysticnametags.licensing.url and mysticnametags.licensing.keys, or neither')
        }
        if (keys.size() > 10) {
            throw new GradleException('At most 10 licensing keys')
        }
        if (!url.isEmpty()) {
            def uri = new URI(url)
            // The same rule the client enforces: HTTPS, or plain HTTP to this machine for development.
            def loopback = uri.scheme == 'http' && uri.host in ['localhost', '127.0.0.1', '[::1]', '::1']
            if (uri.scheme != 'https' && !loopback) {
                throw new GradleException("mysticnametags.licensing.url must use https (http only to localhost): ${url}")
            }
            if (uri.host == null || uri.rawQuery != null || uri.rawFragment != null || url.contains('"') || url.contains('\\')) {
                throw new GradleException("mysticnametags.licensing.url is not a plain base URL: ${url}")
            }
        }

        def urlValue = url.isEmpty() ? 'null' : '"' + url + '"'
        def keyEntries = keys.collect { kid, raw -> "\"${kid}\", \"${raw}\"" }.join(', ')
        new File(outDir, 'LicensingEndpoint.java').setText("""package com.mystichorizons.mysticnametags.generated;

import java.util.Map;

/** Generated by the build from mysticnametags.licensing.url and mysticnametags.licensing.keys. */
public final class LicensingEndpoint {
    private LicensingEndpoint() {
    }

    /** The MysticLicenses API, or null when this build has none. */
    public static String url() {
        return ${urlValue};
    }

    /** Key id to raw Ed25519 public key (base64url), as the licensing service publishes them. */
    public static Map<String, String> publicKeys() {
        return Map.of(${keyEntries});
    }
}
""", 'UTF-8')
    }
}

tasks.named('compileJava') {
    dependsOn 'generateHStatsIdentity', 'generateLicensingEndpoint'
}

// Deploy plugin JAR to server mods folder
tasks.register('deployToServer', Copy) {
    // Using 'from shadowJar' automatically adds task dependency and proper input tracking
    from shadowJar
    into 'server/mods'
    doLast {
        println "Deployed to server/mods/"
    }
}

// Watch for changes and auto-rebuild (useful during development)
tasks.register('watch') {
    doLast {
        println "Watching for changes... Press Ctrl+C to stop."
        println "Run 'gradle build --continuous' for auto-rebuild on file changes."
    }
}
